<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guionista</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111113;--ink2:#3f3f46;--mut:#71717a;--mut2:#a1a1aa;--line:#e7e7ea;--line2:#d4d4d8;--soft:#f4f4f5;--bg:#fafafa;--ok:#15803d;--warn:#b45309;--bad:#dc2626}
body{--c:#71717a;font-family:'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.top{background:#fff;border-bottom:1px solid var(--line);height:60px;padding:0 32px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.logo span{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
#nav{margin-left:auto;display:flex;gap:2px}
#nav button{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);padding:7px 12px;border-radius:8px}
#nav button:hover{color:var(--ink);background:var(--soft)}
#nav button.on{color:var(--ink);background:var(--soft);font-weight:600}
main{max-width:860px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.lbl{font-size:12px;color:var(--mut);margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--mut);font-size:13px;font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.channels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:32px}
.ch{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;transition:border-color .15s,box-shadow .15s}
.ch:hover{border-color:var(--line2)}
.ch.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.mono{width:38px;height:38px;flex-shrink:0;border-radius:9px;background:var(--soft);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;letter-spacing:.02em;position:relative}
.mono .dot{position:absolute;right:-2px;bottom:-2px;border:2px solid #fff;width:11px;height:11px}
.mono.big{width:48px;height:48px;font-size:15px;border-radius:11px}
.chn{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.3}
.chn small{display:block;font-size:12.5px;font-weight:400;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .tick{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:center}
.ch .tick svg{width:12px;height:12px;stroke-width:2.5}
.ch.on .tick{display:flex}
.steps{display:flex;align-items:center;margin-bottom:20px}
.st{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--mut2);font-size:14px}
.st .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;background:#fff}
.st .n svg{width:13px;height:13px;stroke-width:2.5}
.st.now{color:var(--ink)}.st.now .n{border-color:var(--ink);color:var(--ink)}
.st.done{color:var(--ink2)}.st.done .n{border-color:var(--ink);background:var(--ink);color:#fff}
.line{flex:1;height:1px;background:var(--line2);margin:0 14px}
.line.done{background:var(--ink)}
.card{background:#fff;border-radius:14px;padding:28px 30px;border:1px solid var(--line);margin-bottom:16px}
.card h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
.card h3{font-size:15px;font-weight:600}
.help{color:var(--mut);margin-bottom:24px;font-size:14px}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.do{display:flex;gap:14px;margin-bottom:24px}
.do .b{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--line2);color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;margin-top:1px}
.do .b svg{width:12px;height:12px;stroke-width:2.5}
.do.ok .b{background:var(--ink);border-color:var(--ink);color:#fff}
.do .t{flex:1;min-width:0}
.do .t>b{display:block;margin-bottom:10px;font-weight:600;font-size:14.5px}
textarea,input[type=text],input[type=search]{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 13px;font:inherit;font-size:14.5px;background:#fff;color:inherit;transition:border-color .15s,box-shadow .15s}
textarea{min-height:110px;resize:vertical;line-height:1.6}
textarea.long{min-height:170px}
textarea::placeholder,input::placeholder{color:var(--mut2)}
textarea:focus,input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,19,.07)}
.btn{border-radius:9px;padding:9px 15px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;line-height:1.3;transition:background .15s,border-color .15s}
.btn.main{background:var(--ink);color:#fff}
.btn.main:hover{background:#2a2a2e}
.btn.soft{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.soft:hover{background:var(--soft)}
.btn.ghost{color:var(--mut);padding:9px 10px}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.row.between{justify-content:space-between}
.ok-msg{color:var(--ok);font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.err{color:var(--bad);font-size:13px;margin-top:8px;display:none}
.wc{font-size:12.5px;color:var(--mut);margin-top:6px;min-height:18px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px;padding-top:20px;border-top:1px solid var(--line)}
.final{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px 18px;max-height:280px;overflow:auto;margin:12px 0 18px;font-size:14.5px;line-height:1.7}
.final.tall{max-height:540px}
details.prev{margin:-8px 0 24px 38px}
details.prev summary{cursor:pointer;color:var(--mut);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;list-style:none}
details.prev summary::-webkit-details-marker{display:none}
details.prev summary:hover{color:var(--ink)}
.center{text-align:center}
.done-ic{width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done-ic svg{width:22px;height:22px;stroke-width:2.25}
.banner{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 14px;margin-bottom:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.banner .ic{color:var(--mut)}
.banner.warn .ic{color:var(--warn)}
.banner .btn{margin-left:auto}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{flex:1;min-width:220px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut2)}
.search input{padding:8px 12px 8px 34px}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--bg)}
.it{flex:1;min-width:0}
.it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14.5px}
.it small{color:var(--mut);font-size:13px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pill .dot{width:6px;height:6px;background:var(--warn)}
.pill.done .dot{background:var(--ok)}
.pill.gray .dot{background:var(--mut2)}
.empty{text-align:center;color:var(--mut);padding:48px 20px;background:#fff;border-radius:12px;border:1px dashed var(--line2);font-size:14px}
.link{color:var(--mut);font-size:13.5px;margin-bottom:16px;display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--ink)}
.det-h{display:flex;gap:14px;align-items:center}
.title-in{font-size:19px !important;font-weight:600;border-color:transparent !important;padding:3px 8px !important;margin-left:-8px;box-shadow:none !important}
.title-in:hover{border-color:var(--line) !important}
.title-in:focus{border-color:var(--ink) !important}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{padding:9px 12px;font-size:14px;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab:disabled{color:var(--line2);cursor:default}
.ch-edit{display:flex;gap:12px;flex-wrap:wrap}
.ch-edit label{font-size:12.5px;color:var(--mut);font-weight:500;display:flex;flex-direction:column;gap:6px}
.pc-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:4px}
.pc-h .n{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px}
.pc-h>div{flex:1}
.pc-h .help{margin-bottom:12px;font-size:13.5px}
.ptext{min-height:220px;font-size:14px}
code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:12.5px;font-family:Consolas,'Cascadia Mono',monospace;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
.stat span{color:var(--mut);font-size:13px}
.toast-pop{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:20;display:flex;align-items:center;gap:8px}
.toast-pop.show{opacity:1;transform:translateX(-50%)}
.toast-pop.err{background:var(--bad)}
@media (max-width:780px){.channels,.stats{grid-template-columns:1fr}.top{padding:0 16px;gap:10px}#nav button span{display:none}.st{font-size:0;gap:0}.card{padding:22px 20px}details.prev{margin-left:0}main{padding-top:28px}}
</style>
</head>
<body>
<header class="top">
<div class="logo"><span>G</span>Guionista</div>
<nav id="nav"></nav>
</header>
<main id="app"><p class="muted">Cargando…</p></main>
<div id="toast" class="toast-pop" role="status"></div>

<script>
const COLORS={va:'#0d9488',yl:'#e11d48',y3:'#7c3aed'};
const STEP_NAMES=['Crear','Verificar','Humanizar'];
const STEP_TITLES=['Crear el guion','Verificar los datos','Humanizar el guion'];
const STEP_HELP=['Escribe la idea del video.','El guion del paso 1 ya va dentro del prompt.','El guion verificado ya va dentro del prompt.'];
const ICONS={
 pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
 files:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
 sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 archive:'<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>',
 copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 ext:'<path d="M15 3h6v6M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 right:'<path d="M5 12h14M12 5l7 7-7 7"/>',
 left:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 play:'<path d="m7 4 12 8-12 8V4z"/>',
 trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
 down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
 eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

function defaults(){return{version:1,channels:[
 {id:'va',name:'Viviendo A360',sub:'Vida en Uruguay, historia y documental',prompts:['','','']},
 {id:'yl',name:'Yoa y Lary',sub:'Vlog familiar, día a día y viajes',prompts:['','','']},
 {id:'y3',name:'Yoa 360',sub:'Historias de superación del mundo',prompts:['','','']}],
 scripts:[],activeId:null,lastChannel:'va',lastBackup:null};}

/* ---------- almacenamiento (IndexedDB, con respaldo en localStorage) ---------- */
const DB_NAME='guionista',STORE='kv';
let dbh=null,saveT=null,D=null,memOnly=false;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function load(){
 try{dbh=await openDB();return await new Promise((res,rej)=>{const q=dbh.transaction(STORE).objectStore(STORE).get('data');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
 catch(e){dbh=null;try{const s=localStorage.getItem('guionista');return s?JSON.parse(s):null;}catch(_){memOnly=true;return null;}}
}
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250);}
function saveNow(){
 clearTimeout(saveT);saveT=null;
 const data=JSON.parse(JSON.stringify(D));
 if(dbh){const tx=dbh.transaction(STORE,'readwrite');tx.objectStore(STORE).put(data,'data');tx.onerror=()=>toast('No se pudo guardar. Descarga una copia de seguridad.',true);}
 else if(!memOnly){try{localStorage.setItem('guionista',JSON.stringify(data));}catch(e){toast('No se pudo guardar. Descarga una copia de seguridad.',true);}}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)saveNow();});
window.addEventListener('beforeunload',()=>{if(saveT)saveNow();});
function normalize(d){
 const def=defaults();
 if(!d||!Array.isArray(d.channels)||!Array.isArray(d.scripts))return def;
 def.channels.forEach(c=>{if(!d.channels.find(x=>x.id===c.id))d.channels.push(c);});
 d.channels.forEach(c=>{if(!Array.isArray(c.prompts))c.prompts=[];while(c.prompts.length<3)c.prompts.push('');c.name=c.name||'Canal';c.sub=c.sub||'';});
 d.scripts.forEach(s=>{if(!Array.isArray(s.texts))s.texts=[];while(s.texts.length<3)s.texts.push('');s.idea=s.idea||'';s.step=Math.min(3,Math.max(0,s.step|0));s.created=s.created||Date.now();s.updated=s.updated||s.created;});
 if(!d.channels.find(c=>c.id===d.lastChannel))d.lastChannel=d.channels[0].id;
 return d;
}

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const words=t=>{t=(t||'').trim();return t?t.split(/\s+/).length:0;};
const fmtWords=t=>{const w=words(t);return w?`${w.toLocaleString('es')} palabras · ≈ ${Math.max(1,Math.round(w/150))} min de narración`:'';};
const ch=id=>D.channels.find(c=>c.id===id)||D.channels[0];
const col=id=>COLORS[id]||'#71717a';
const mono=c=>{const w=(c.name||'?').trim().split(/\s+/);return (w[0][0]+(w.length>1?w[w.length-1][0]:(w[0][1]||''))).toUpperCase();};
const monoBox=(c,big)=>`<span class="mono ${big?'big':''}">${esc(mono(c))}<span class="dot" style="background:${col(c.id)}"></span></span>`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate=ts=>new Date(ts).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'});
const deriveTitle=idea=>{const t=(idea||'').trim().split('\n')[0];return t.length>70?t.slice(0,67)+'…':t;};
const titleOf=s=>s.title||deriveTitle(s.idea)||'Guion sin título';
const statusPill=s=>s.step>=3?`<span class="pill done"><span class="dot"></span>Listo</span>`:`<span class="pill"><span class="dot"></span>Paso ${s.step+1} de 3 · ${STEP_NAMES[s.step]}</span>`;
let toastT;
function toast(msg,err){const el=$('#toast');el.innerHTML=(err?I('alert'):I('check'))+esc(msg);el.className='toast-pop show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>el.className='toast-pop',2400);}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);return true;}
 catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;}
}
function show(id,html){const el=document.getElementById(id);if(!el)return;if(html!==undefined)el.innerHTML=html;el.style.display='block';}
function hide(id){const el=document.getElementById(id);if(el)el.style.display='none';}
function markDo(id,ok){const el=document.getElementById(id);if(!el)return;el.classList.toggle('ok',ok);el.querySelector('.b').innerHTML=ok?I('check'):el.dataset.l;}

/* ---------- estado ---------- */
let view='nuevo',detailId=null,detailTab=null,promptCh=null,filterCh='all',query='',copiedStep=-1;
const cur=()=>D.scripts.find(s=>s.id===D.activeId)||null;
function ensureScript(){
 let s=cur();
 if(!s){s={id:uid(),channel:D.lastChannel,title:'',idea:'',texts:['','',''],step:0,created:Date.now(),updated:Date.now()};D.scripts.unshift(s);D.activeId=s.id;}
 return s;
}
function purgeEmpty(){
 D.scripts=D.scripts.filter(s=>s.idea.trim()||s.texts.some(t=>t.trim()));
 if(!cur())D.activeId=null;
}
function buildPrompt(C,step,s){
 const tpl=C.prompts[step]||'';
 const prev=step>0?s.texts[step-1]:'';
 let out=tpl.split('{{IDEA}}').join(s.idea);
 out=out.split('{{GUION}}').join(prev);
 const tag=step===0?'{{IDEA}}':'{{GUION}}';
 if(!tpl.includes(tag))out=out.trimEnd()+'\n\n'+(step===0?'IDEA DEL GUION:\n'+s.idea:'GUION:\n'+prev);
 return out;
}

/* ---------- navegación ---------- */
const NAV=[['nuevo','pen','Crear guion'],['guiones','files','Mis guiones'],['prompts','sliders','Mis prompts'],['respaldo','archive','Copia de seguridad']];
$('#nav').innerHTML=NAV.map(([v,ic,t])=>`<button data-v="${v}" title="${t}">${I(ic)}<span>${t}</span></button>`).join('');
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v);});
function go(v){view=v;copiedStep=-1;render();window.scrollTo(0,0);}
function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view||(view==='detalle'&&b.dataset.v==='guiones')));
 const app=$('#app');
 if(view==='nuevo')app.innerHTML=vNuevo();
 else if(view==='guiones'){app.innerHTML=vGuiones();renderList();}
 else if(view==='detalle')app.innerHTML=vDetalle();
 else if(view==='prompts')app.innerHTML=vPrompts();
 else app.innerHTML=vRespaldo();
}
function backupBanner(){
 if(!D.scripts.length)return'';
 if(D.lastBackup&&Date.now()-D.lastBackup<14*864e5)return'';
 return `<div class="banner"><span class="ic">${I('archive')}</span>${D.lastBackup?'Hace más de 2 semanas que no descargas una copia de seguridad.':'Todavía no descargaste ninguna copia de seguridad.'}<button class="btn soft sm" onclick="go('respaldo')">Hacer copia</button></div>`;
}
function channelButtons(selected,handler){
 return `<div class="channels">${D.channels.map(x=>`<button class="ch ${x.id===selected?'on':''}" onclick="${handler}('${x.id}')">${monoBox(x)}<span class="chn">${esc(x.name)}<small>${esc(x.sub)}</small></span><span class="tick">${I('check')}</span></button>`).join('')}</div>`;
}
function stepsBar(step){
 return `<div class="steps">${STEP_NAMES.map((n,i)=>`${i?`<div class="line ${i<=step?'done':''}"></div>`:''}<div class="st ${i<step?'done':i===step?'now':''}"><span class="n">${i<step?I('check'):i+1}</span>${n}</div>`).join('')}</div>`;
}

/* ---------- vista: crear guion ---------- */
function vNuevo(){
 const s=cur(),cid=s?s.channel:D.lastChannel,C=ch(cid),step=s?s.step:0;
 let h=backupBanner();
 h+=`<div class="lbl">Canal</div>`+channelButtons(cid,'pickCh');
 const missing=C.prompts.filter(p=>!p.trim()).length;
 if(missing)h+=`<div class="banner warn"><span class="ic">${I('alert')}</span>${missing===1?'Falta 1 prompt maestro':'Faltan '+missing+' prompts maestros'} de ${esc(C.name)}.<button class="btn soft sm" onclick="openPrompts('${cid}')">Cargar prompts</button></div>`;
 h+=`<div class="lbl">Progreso${s?` <span class="muted" style="text-transform:none;letter-spacing:0">· ${esc(titleOf(s))}</span>`:''}</div>`+stepsBar(step);
 if(step>=3)return h+finalCard(s,C);
 const idea=s?s.idea:'',resp=s?s.texts[step]:'';
 const L=step===0?['1','2','3']:['','1','2'];
 h+=`<div class="card"><div class="card-h"><div><h2>${STEP_TITLES[step]}</h2><p class="help">${esc(C.name)} · ${STEP_HELP[step]}</p></div>${s?`<button class="btn ghost sm" onclick="newScript()">${I('plus')}Nuevo guion</button>`:''}</div>`;
 if(step===0){
  h+=`<div class="do ${idea.trim()?'ok':''}" id="do-idea" data-l="1"><span class="b">${idea.trim()?I('check'):'1'}</span><div class="t"><b>Escribe la idea del video</b><textarea id="idea" placeholder="Ejemplo: la historia del Palacio Salvo, el edificio más alto de Sudamérica en 1928" oninput="onIdea(this.value)">${esc(idea)}</textarea><div class="err" id="e-idea">Escribe la idea primero.</div></div></div>`;
 }
 const cpOk=copiedStep===step;
 h+=`<div class="do ${cpOk?'ok':''}" id="do-cp" data-l="${L[1]}"><span class="b">${cpOk?I('check'):L[1]}</span><div class="t"><b>Copia el prompt y pégalo en Claude</b>
 <div class="row"><button class="btn main" onclick="copyPrompt()">${I('copy')}Copiar prompt ${step+1}</button><a class="btn soft" href="https://claude.ai/new" target="_blank" rel="noopener">${I('ext')}Abrir Claude</a><span class="ok-msg" id="cp-ok">${cpOk?I('check')+'Copiado':''}</span></div><div class="err" id="e-cp"></div></div></div>`;
 if(step>0){const prev=s.texts[step-1];h+=`<details class="prev"><summary>${I('eye')}Ver el guion incluido en el prompt · ${fmtWords(prev)}</summary><div class="final">${esc(prev)}</div></details>`;}
 h+=`<div class="do ${resp.trim()?'ok':''}" id="do-resp" data-l="${L[2]}"><span class="b">${resp.trim()?I('check'):L[2]}</span><div class="t"><b>Pega la respuesta de Claude</b><textarea id="resp" class="long" placeholder="Pega aquí la respuesta completa" oninput="onResp(this.value)">${esc(resp)}</textarea><div class="wc" id="wc">${fmtWords(resp)}</div><div class="err" id="e-resp">Pega la respuesta de Claude para continuar.</div></div></div>`;
 h+=`<div class="foot"><button class="btn ghost" onclick="back()" style="visibility:${step?'visible':'hidden'}">${I('left')}Atrás</button><span class="muted">Se guarda automáticamente</span><button class="btn main" onclick="next()">${step===2?'Terminar'+I('check'):'Siguiente'+I('right')}</button></div></div>`;
 return h;
}
function finalCard(s,C){
 return `<div class="card center"><div class="done-ic">${I('check')}</div><h2>Guion listo</h2><p class="help" style="margin-bottom:6px">“${esc(titleOf(s))}” quedó guardado en Mis guiones · ${esc(C.name)}</p><p class="muted">${fmtWords(s.texts[2])}</p><div class="final" style="text-align:left">${esc(s.texts[2])}</div>
 <div class="row center"><button class="btn main" onclick="copyFinal()">${I('copy')}Copiar guion final</button><button class="btn soft" onclick="openDetail('${s.id}')">${I('files')}Ver versiones</button><button class="btn soft" onclick="newScript()">${I('plus')}Nuevo guion</button></div>
 <div style="margin-top:18px"><button class="link" style="margin:0" onclick="back()">${I('left')}Volver al paso 3</button></div></div>`;
}
function onIdea(v){const s=ensureScript();s.idea=v;s.updated=Date.now();save();markDo('do-idea',!!v.trim());hide('e-idea');}
function onResp(v){const s=ensureScript();s.texts[s.step]=v;s.updated=Date.now();save();markDo('do-resp',!!v.trim());$('#wc').textContent=fmtWords(v);hide('e-resp');}
async function copyPrompt(){
 const s=cur(),cid=s?s.channel:D.lastChannel,C=ch(cid),step=s?s.step:0;
 hide('e-cp');
 if(step===0&&!(s&&s.idea.trim())){show('e-idea');$('#idea').focus();return;}
 if(!C.prompts[step].trim()){show('e-cp',`Todavía no cargaste el prompt ${step+1} de ${esc(C.name)}. <button class="btn soft sm" onclick="openPrompts('${cid}')">Cargarlo ahora</button>`);return;}
 if(await copyText(buildPrompt(C,step,s))){copiedStep=step;markDo('do-cp',true);$('#cp-ok').innerHTML=I('check')+'Copiado. Pégalo en Claude';toast('Prompt copiado');}
 else show('e-cp','No se pudo copiar. Intenta de nuevo.');
}
function next(){
 const s=cur();
 if(!s||!s.texts[s.step].trim()){show('e-resp');$('#resp').focus();return;}
 s.step++;s.updated=Date.now();if(s.step===3)s.finished=Date.now();
 saveNow();copiedStep=-1;render();window.scrollTo({top:0,behavior:'smooth'});
 if(s.step===3)toast('Guion terminado y guardado');
}
function back(){const s=cur();if(!s||s.step===0)return;s.step--;s.updated=Date.now();save();copiedStep=-1;render();}
function newScript(){purgeEmpty();D.activeId=null;save();copiedStep=-1;go('nuevo');}
function pickCh(id){
 const s=cur();
 if(!s){D.lastChannel=id;save();copiedStep=-1;render();return;}
 if(s.channel===id)return;
 const started=s.step>0||s.texts.some(t=>t.trim());
 if(!started){s.channel=id;D.lastChannel=id;save();copiedStep=-1;render();return;}
 if(confirm(`Este guion es de ${ch(s.channel).name} y ya está en marcha.\n\n¿Empezar un guion nuevo para ${ch(id).name}? El actual queda guardado en "Mis guiones" y puedes continuarlo cuando quieras.`)){
  D.activeId=null;D.lastChannel=id;save();copiedStep=-1;render();
 }
}
async function copyFinal(){const s=cur();if(s&&await copyText(s.texts[2]))toast('Guion final copiado');}

/* ---------- vista: mis guiones ---------- */
function vGuiones(){
 const chip=(id,label,c)=>`<button class="chip ${filterCh===id?'on':''}" onclick="filterCh='${id}';render()">${c?`<span class="dot" style="background:${col(c)}"></span>`:''}${esc(label)}</button>`;
 return backupBanner()+`<div class="page-h"><h1>Mis guiones</h1><button class="btn main" onclick="newScript()">${I('plus')}Nuevo guion</button></div>
 <div class="filters"><div class="chips">${chip('all','Todos')}${D.channels.map(c=>chip(c.id,c.name,c.id)).join('')}</div><div class="search">${I('search')}<input id="q" type="search" placeholder="Buscar por título o idea" value="${esc(query)}" oninput="query=this.value;renderList()"></div></div><div id="list"></div>`;
}
function renderList(){
 const ql=query.trim().toLowerCase();
 const arr=D.scripts.filter(s=>(filterCh==='all'||s.channel===filterCh)&&(!ql||titleOf(s).toLowerCase().includes(ql)||s.idea.toLowerCase().includes(ql))).sort((a,b)=>b.updated-a.updated);
 $('#list').innerHTML=arr.length?`<div class="list">${arr.map(s=>{const C=ch(s.channel);return `<button class="item" onclick="openDetail('${s.id}')">${monoBox(C)}<span class="it"><b>${esc(titleOf(s))}</b><small>${esc(C.name)} · ${fmtDate(s.updated)}</small></span>${statusPill(s)}</button>`;}).join('')}</div>`
 :`<div class="empty">${D.scripts.length?'No hay guiones que coincidan con la búsqueda.':'Todavía no tienes guiones. Crea el primero con “Nuevo guion”.'}</div>`;
}
function openDetail(id){detailId=id;detailTab=null;go('detalle');}

/* ---------- vista: detalle de un guion ---------- */
function detailTabs(s){return[['idea','Idea',s.idea],['0','1 · Creado',s.texts[0]],['1','2 · Verificado',s.texts[1]],['2','3 · Humanizado',s.texts[2]]];}
function vDetalle(){
 const s=D.scripts.find(x=>x.id===detailId);
 if(!s){view='guiones';setTimeout(render);return'';}
 const C=ch(s.channel);
 const tabs=detailTabs(s),avail=tabs.filter(t=>t[2].trim());
 if(!detailTab||!avail.find(t=>t[0]===detailTab))detailTab=avail.length?avail[avail.length-1][0]:'idea';
 const ct=tabs.find(t=>t[0]===detailTab);
 return `<button class="link" onclick="go('guiones')">${I('left')}Mis guiones</button>
 <div class="card"><div class="det-h">${monoBox(C,true)}<div style="flex:1;min-width:0"><input type="text" class="title-in" value="${esc(titleOf(s))}" onchange="renameScript(this.value)" aria-label="Título del guion" title="Haz clic para cambiar el título"><div class="row" style="gap:10px;margin-top:2px"><span class="muted">${esc(C.name)} · creado el ${fmtDate(s.created)}</span>${statusPill(s)}</div></div></div>
 <div class="row" style="margin:20px 0 22px">${s.step<3?`<button class="btn main" onclick="continueScript()">${I('play')}Continuar en el paso ${s.step+1}</button>`:''}<button class="btn soft danger" onclick="delScript()">${I('trash')}Eliminar</button></div>
 <div class="tabs">${tabs.map(t=>`<button class="tab ${t[0]===detailTab?'on':''}" ${t[2].trim()?'':'disabled'} onclick="detailTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
 <div class="row between"><span class="muted">${fmtWords(ct[2])}</span><button class="btn soft sm" onclick="copyVersion()">${I('copy')}Copiar texto</button></div>
 <div class="final tall">${ct[2].trim()?esc(ct[2]):'<span class="muted">Vacío</span>'}</div></div>`;
}
function renameScript(v){const s=D.scripts.find(x=>x.id===detailId);if(!s)return;s.title=v.trim();s.updated=Date.now();save();toast('Título guardado');}
function continueScript(){const s=D.scripts.find(x=>x.id===detailId);if(!s)return;D.activeId=s.id;D.lastChannel=s.channel;save();go('nuevo');}
async function copyVersion(){const s=D.scripts.find(x=>x.id===detailId);const t=detailTabs(s).find(x=>x[0]===detailTab);if(t&&await copyText(t[2]))toast('Texto copiado');}
function delScript(){
 const s=D.scripts.find(x=>x.id===detailId);if(!s)return;
 if(!confirm(`¿Eliminar "${titleOf(s)}"?\n\nSe borran la idea y las 3 versiones. No se puede deshacer.`))return;
 D.scripts=D.scripts.filter(x=>x.id!==s.id);if(D.activeId===s.id)D.activeId=null;saveNow();toast('Guion eliminado');go('guiones');
}

/* ---------- vista: mis prompts ---------- */
function openPrompts(id){promptCh=id;go('prompts');}
function pickPromptCh(id){promptCh=id;render();}
function vPrompts(){
 if(!promptCh)promptCh=(cur()&&cur().channel)||D.lastChannel;
 const C=ch(promptCh);
 const descs=['Recibe la idea del video y escribe el guion. Escribe <code>{{IDEA}}</code> donde quieras que vaya la idea.','Recibe el guion del paso 1 y corrige los datos. Escribe <code>{{GUION}}</code> donde quieras que vaya el guion.','Recibe el guion verificado y lo humaniza. Escribe <code>{{GUION}}</code> donde quieras que vaya el guion.'];
 return `<div class="page-h"><h1>Mis prompts maestros</h1><span class="muted" id="saved">Se guardan automáticamente</span></div>
 <div class="lbl">Canal</div>${channelButtons(promptCh,'pickPromptCh')}
 <div class="card"><div class="ch-edit"><label style="flex:1;min-width:180px">Nombre del canal<input type="text" value="${esc(C.name)}" oninput="editCh('name',this.value)"></label><label style="flex:2;min-width:220px">Descripción<input type="text" value="${esc(C.sub)}" oninput="editCh('sub',this.value)"></label></div></div>
 ${[0,1,2].map(i=>`<div class="card"><div class="pc-h"><span class="n">${i+1}</span><div><h3>Prompt ${i+1} · ${STEP_NAMES[i]}</h3><p class="help">${descs[i]}</p></div><span id="pp${i}">${pPill(C.prompts[i])}</span></div><textarea class="ptext" placeholder="Pega aquí tu prompt maestro ${i+1} de ${esc(C.name)}" oninput="editPrompt(${i},this.value)">${esc(C.prompts[i])}</textarea></div>`).join('')}
 <p class="muted">Si un prompt no incluye <code>{{IDEA}}</code> o <code>{{GUION}}</code>, la app agrega el texto al final automáticamente.</p>`;
}
const pPill=v=>v.trim()?'<span class="pill done"><span class="dot"></span>Cargado</span>':'<span class="pill gray"><span class="dot"></span>Vacío</span>';
let savedT;
function flashSaved(){const el=$('#saved');if(!el)return;el.textContent='Guardado';el.style.color='var(--ok)';clearTimeout(savedT);savedT=setTimeout(()=>{el.textContent='Se guardan automáticamente';el.style.color='';},1500);}
function editCh(k,v){ch(promptCh)[k]=v;save();flashSaved();}
function editPrompt(i,v){ch(promptCh).prompts[i]=v;save();flashSaved();$('#pp'+i).innerHTML=pPill(v);}

/* ---------- vista: copia de seguridad ---------- */
function vRespaldo(){
 const loaded=D.channels.reduce((n,c)=>n+c.prompts.filter(p=>p.trim()).length,0);
 return `<div class="page-h"><h1>Copia de seguridad</h1></div>
 <div class="stats"><div class="stat"><b>${D.scripts.length}</b><span>Guiones guardados</span></div><div class="stat"><b>${loaded} / 9</b><span>Prompts maestros</span></div><div class="stat"><b>${D.lastBackup?fmtDate(D.lastBackup):'Nunca'}</b><span>Última copia</span></div></div>
 <div class="card"><h2>Descargar copia</h2><p class="help">Tus prompts y guiones se guardan solo en este navegador, en esta PC. Descarga una copia periódicamente y guárdala en Google Drive o en un pendrive. Te permite recuperar todo o pasarlo a otra computadora.</p><button class="btn main" onclick="exportData()">${I('down')}Descargar copia</button></div>
 <div class="card"><h2>Restaurar copia</h2><p class="help">Carga un archivo de copia (.json) descargado antes. Reemplaza todo lo que hay ahora en la app.</p><label class="btn soft">${I('up')}Elegir archivo<input type="file" accept=".json,application/json" hidden onchange="importData(this)"></label></div>`;
}
function exportData(){
 D.lastBackup=Date.now();saveNow();
 const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`guionista-copia-${new Date().toISOString().slice(0,10)}.json`;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 toast('Copia descargada');render();
}
async function importData(inp){
 const f=inp.files[0];inp.value='';if(!f)return;
 let p;try{p=JSON.parse(await f.text());}catch(e){toast('Ese archivo no es una copia válida',true);return;}
 if(!p||!Array.isArray(p.channels)||!Array.isArray(p.scripts)){toast('Ese archivo no es una copia de Guionista',true);return;}
 if(!confirm(`Esta copia tiene ${p.scripts.length} guiones.\n\n¿Reemplazar todo lo que hay ahora en la app?`))return;
 D=normalize(p);saveNow();toast('Copia restaurada');go('nuevo');
}

/* ---------- inicio ---------- */
(async()=>{
 D=normalize(await load());purgeEmpty();render();
 if(memOnly)toast('Este navegador no permite guardar aquí. Abre la app desde Chrome o Edge.',true);
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
